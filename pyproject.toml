[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "earth-observation"
version = "0.1.0"
description = "A bounded data pilot for frozen Earth-observation retrieval"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19,<24",
    "rasterio>=1.4,<2",
    "matplotlib>=3.10,<4",
    "zstandard>=0.23,<1",
    "open-clip-torch>=3.2,<4",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "nbformat>=5.10,<6", "nbconvert>=7.16,<8", "ipykernel>=6.29,<8"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: checks using official cached pilot data"]
